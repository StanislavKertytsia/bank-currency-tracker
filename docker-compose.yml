services:
  mysql:
    image: mysql:8
    container_name: mysql-tracker
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: back
    ports:
      - "3306:3306"
    volumes:
      - mysql-tracker-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: redis-tracker
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-tracker-data:/data

volumes:
  mysql-tracker-data:
  redis-tracker-data:
